<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- The old "Services" page has been retired. 1 Oak Advisory buys residential second mortgages
       and HELOCs; the equivalent page is now "What We Buy". This stub keeps the old URL alive.
       If the site is served by a host that supports redirects (Netlify _redirects, Vercel,
       Apache .htaccess, IIS web.config), replace this file with a 301 to /what-we-buy.html. -->
  <title>What We Buy — 1 Oak Advisory</title>
  <link rel="canonical" href="https://www.1oakadvisory.com/what-we-buy.html">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="0; url=what-we-buy.html">
  <link rel="icon" type="image/png" href="assets/IMG_7956.PNG">
  <link rel="stylesheet" href="css/styles.css">
  <noscript>
    <style>
      .page-hero .label, .page-hero__title, .page-hero__body
        { opacity: 1 !important; transform: none !important; }
      .cursor-ring, .cursor-dot { display: none !important; }
      * { cursor: auto !important; }
      a, button { cursor: pointer !important; }
    </style>
  </noscript>
</head>
<body>

  <!-- Custom Cursor — the stylesheet hides the native one site-wide. -->
  <div class="cursor-ring" aria-hidden="true"></div>
  <div class="cursor-dot"  aria-hidden="true"></div>

  <main id="main" tabindex="-1">
  <div class="page-hero">
    <div class="page-hero__inner">
      <p class="label">Page Moved</p>
      <h1 class="page-hero__title">This Page Is Now &ldquo;What We Buy&rdquo;</h1>
      <p class="page-hero__body">You are being redirected. If nothing happens, continue to the What We Buy page.</p>
      <div class="section__actions">
        <a href="what-we-buy.html" class="btn btn--primary">Continue</a>
        <a href="index.html" class="btn btn--outline">Home</a>
      </div>
    </div>
  </div>
  </main>

  <script src="js/main.js"></script>
